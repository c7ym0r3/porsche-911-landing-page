<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porsche 911</title>
  <link rel="stylesheet" href="./styles/css/reset.css" />
  <link rel="stylesheet" href="./styles/css/style.css" />
</head>

<body>
  <header class="header">
    <div class="container">
      <button class="header__menu">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M19 12.75H5C4.80109 12.75 4.61032 12.671 4.46967 12.5303C4.32902 12.3897 4.25 12.1989 4.25 12C4.25 11.8011 4.32902 11.6103 4.46967 11.4697C4.61032 11.329 4.80109 11.25 5 11.25H19C19.1989 11.25 19.3897 11.329 19.5303 11.4697C19.671 11.6103 19.75 11.8011 19.75 12C19.75 12.1989 19.671 12.3897 19.5303 12.5303C19.3897 12.671 19.1989 12.75 19 12.75Z"
            fill="#000" />
          <path
            d="M19 8.25H5C4.80109 8.25 4.61032 8.17098 4.46967 8.03033C4.32902 7.88968 4.25 7.69891 4.25 7.5C4.25 7.30109 4.32902 7.11032 4.46967 6.96967C4.61032 6.82902 4.80109 6.75 5 6.75H19C19.1989 6.75 19.3897 6.82902 19.5303 6.96967C19.671 7.11032 19.75 7.30109 19.75 7.5C19.75 7.69891 19.671 7.88968 19.5303 8.03033C19.3897 8.17098 19.1989 8.25 19 8.25Z"
            fill="#000" />
          <path
            d="M19 17.25H5C4.80109 17.25 4.61032 17.171 4.46967 17.0303C4.32902 16.8897 4.25 16.6989 4.25 16.5C4.25 16.3011 4.32902 16.1103 4.46967 15.9697C4.61032 15.829 4.80109 15.75 5 15.75H19C19.1989 15.75 19.3897 15.829 19.5303 15.9697C19.671 16.1103 19.75 16.3011 19.75 16.5C19.75 16.6989 19.671 16.8897 19.5303 17.0303C19.3897 17.171 19.1989 17.25 19 17.25Z"
            fill="#000" />
        </svg> Menu
      </button>

      <div class="menu__main">
        <div class="container">
          <ul class="menu__list">
            <li class="menu__list-item">
              <button id="modelsBtn" class="active">
                Models
                <svg width="24" height="24" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M11.89 8l-1.415 1.414-4.95 4.95-1.414-1.414L9.06 8 4.11 3.05l1.414-1.414 4.95 4.95L11.889 8z"
                    fill="#000"></path>
                </svg>
              </button>
            </li>
            <li class="menu__list-item">
              <button id="ElectricBtn">
                Electric
                <svg width="24" height="24" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M11.89 8l-1.415 1.414-4.95 4.95-1.414-1.414L9.06 8 4.11 3.05l1.414-1.414 4.95 4.95L11.889 8z"
                    fill="#000"></path>
                </svg>
              </button>
            </li>
            <li class="menu__list-item">
              <button id="purchaseBtn">
                Vehicle Purchase
                <svg width="24" height="24" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M11.89 8l-1.415 1.414-4.95 4.95-1.414-1.414L9.06 8 4.11 3.05l1.414-1.414 4.95 4.95L11.889 8z"
                    fill="#000"></path>
                </svg>
              </button>
            </li>
            <li class="menu__list-item">
              <button id="servicesBtn">
                Services
                <svg width="24" height="24" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M11.89 8l-1.415 1.414-4.95 4.95-1.414-1.414L9.06 8 4.11 3.05l1.414-1.414 4.95 4.95L11.889 8z"
                    fill="#000"></path>
                </svg>
              </button>
            </li>
            <li class="menu__list-item">
              <button id="experienceBtn">
                Experience
                <svg width="24" height="24" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M11.89 8l-1.415 1.414-4.95 4.95-1.414-1.414L9.06 8 4.11 3.05l1.414-1.414 4.95 4.95L11.889 8z"
                    fill="#000"></path>
                </svg>
              </button>
            </li>
            <li class="menu__list-item">
              <button id="findBtn">
                Find a Dealer
                <svg width="24" height="24" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M11.89 8l-1.415 1.414-4.95 4.95-1.414-1.414L9.06 8 4.11 3.05l1.414-1.414 4.95 4.95L11.889 8z"
                    fill="#000"></path>
                </svg>
              </button>
            </li>

            <button>Account</button>
          </ul>

          <div class="menu__content">
            <div class="container">
              <div class="menu__content-item" id="models">
                <ul class="models__cards-list">
                  <li class="models__cards-item">
                    <h2 class="models__card-title">911</h2>
                    <img src="./img/911.webp" alt="911 icon">
                    <span class="models__card-tag">Gasoline</span>
                  </li>
                  <li class="models__cards-item">
                    <h2 class="models__card-title">718</h2>
                    <img src="./img/718.webp" alt="711 icon">
                    <span class="models__card-tag">Gasoline</span>
                  </li>
                  <li class="models__cards-item">
                    <h2 class="models__card-title">Taycan</h2>
                    <img src="./img/taycan.webp" alt="taycan icon">
                    <span class="models__card-tag">Electric</span>
                  </li>
                  <li class="models__cards-item">
                    <h2 class="models__card-title">Panamera</h2>
                    <img src="./img/panamera.webp" alt="panamera icon">
                    <div class="models__tag-list">
                      <span class="models__card-tag">Hybrid</span>
                      <span class="models__card-tag">Gasoline</span>
                    </div>
                  </li>
                  <li class="models__cards-item">
                    <h2 class="models__card-title">Macan</h2>
                    <img src="./img/macan.webp" alt="macan icon">
                    <span class="models__card-tag">Electric</span>
                  </li>
                  <li class="models__cards-item">
                    <h2 class="models__card-title">Cayenne</h2>
                    <img src="./img/cayenne-electric.webp" alt="cayenne icon">
                    <div class="models__tag-list">
                      <span class="models__card-tag">Electric</span>
                      <span class="models__card-tag">Hybrid</span>
                      <span class="models__card-tag">Gasoline</span>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <button class="main__menu-close">x</button>
      </div>

      <a class="header__logo" href="https://porsche.com">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4500 300" aria-hidden="true"
          class="hidden w-auto sm:block scheme-light fill-primary" style="
              height: round(down, clamp(0.63rem, 0.5rem + 0.42vw, 1rem), 1px);
            ">
          <title class="">Porsche</title>
          <path
            d="M502 221c48.1 0 74-25.9 74-74V74c0-48.1-25.9-74-74-74H0v300h68v-79h434zm6-143v65c0 7.8-4.2 12-12 12H68V66h428c7.8 0 12 4.2 12 12zm228 222c-48.1 0-74-25.9-74-74V74c0-48.1 25.9-74 74-74h417c48.1 0 74 25.9 74 74v152c0 48.1-25.9 74-74 74H736zm411-66c7.8 0 12-4.2 12-12V78c0-7.8-4.2-12-12-12H742c-7.8 0-12 4.2-12 12v144c0 7.8 4.2 12 12 12h405zm675-36c39.844 16.757 67.853 56.1 68 102h-68c0-54-25-79-79-79h-361v79h-68V0h502c48.1 0 74 25.9 74 74v50.14c0 46.06-23.75 71.76-68 73.86zm-12-43c7.8 0 12-4.2 12-12V78c0-7.8-4.2-12-12-12h-428v89h428zm162-81c0-48.1 25.9-74 74-74h492v56h-486c-7.8 0-12 4.2-12 12v42c0 7.8 4.2 12 12 12h422c48.1 0 74 25.9 74 74v30c0 48.1-25.9 74-74 74h-492v-56h486c7.8 0 12-4.2 12-12v-42c0-7.8-4.2-12-12-12h-422c-48.1 0-74-25.9-74-74V74zm661 0c0-48.1 25.9-74 74-74h480v66h-474c-7.8 0-12 4.2-12 12v144c0 7.8 4.2 12 12 12h474v66h-480c-48.1 0-74-25.9-74-74V74zM3817 0v300h-68V183h-407v117h-68V0h68v117h407V0h68zm156 56v66h527v56h-527v66h527v56h-595V0h595v56h-527z"
            class="" style="fill: #000"></path>
        </svg>
      </a>

      <div class="header__btns">
        <button class="header__country"><img src="./img/icons/russian-flag.svg" alt="russia" width="24"
            height="24"></button>
        <button class="header__account">
          <img src="./img/icons/account.svg" alt="account" width="24" height="24">
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="hero" id="hero">
      <div class="hero__stage">
        <div class="hero__bg-text"><img src="./img/icons/gt3.svg" alt="gt3 icon" width="906" height="150"></div>
        <img src="./img/911turbos.avif" alt="911 img" class="hero__car">
      </div>

      <nav class="hero__tabs">
        <button class="tab">Coupe</button>
        <button class="tab">Cabriolet</button>
        <button class="tab">Targa</button>
        <button class="tab active">GT</button>
        <button class="tab">GT Cabriolet</button>
        <button class="tab">Turbo Coupe</button>
        <button class="tab">Turbo Cabriolet</button>
      </nav>

      <h1 class="hero__title">911 GT3</h1>
      <span class="hero__badge">Gasoline</span>

      <div class="hero__actions">
        <button class="btn dark">Change model variant</button>
        <button class="btn light">Configure</button>
      </div>
    </section>
    <script src="./script.js"></script>
</body>

</html>
